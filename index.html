<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космический Уклонист</title>
    <link rel="stylesheet" href="style.css">
    <!-- Yandex Games SDK -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
</head>
<body>
    <!-- Игровой холст -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD во время игры -->
    <div id="hud" class="hidden">
        <div id="hudScore" class="hud-item hud-left">🏆 0</div>
        <div id="hudCoins" class="hud-item hud-right">💰 0</div>
        <div id="zoneNotice" class="zone-notice hidden"></div>
    </div>

    <!-- Стартовый экран -->
    <div id="startScreen" class="screen">
        <h1 class="game-title">🚀 Космический Уклонист</h1>
        <p class="game-desc">Управляй кораблём и уклоняйся от астероидов!<br>Веди пальцем или мышью влево-вправо.</p>
        <div class="stats-row">
            <div class="stat-box">💰 <span id="startCoins">0</span></div>
            <div class="stat-box">🏆 Рекорд: <span id="startBest">0</span></div>
        </div>
        <button id="btnPlay" class="btn btn-play">▶ ИГРАТЬ</button>
        <button id="btnShop" class="btn btn-shop">🛒 МАГАЗИН</button>
    </div>

    <!-- Экран магазина -->
    <div id="shopScreen" class="screen hidden">
        <h2 class="screen-title">🛒 Магазин скинов</h2>
        <div class="coins-display">💰 <span id="shopCoins">0</span></div>
        <div id="skinGrid" class="skin-grid"><!-- карточки генерируются в JS --></div>
        <button id="btnBackShop" class="btn btn-back">⬅ НАЗАД</button>
    </div>

    <!-- Экран Game Over -->
    <div id="gameOverScreen" class="screen hidden">
        <h2 class="gameover-title">💥 Игра окончена</h2>
        <div class="result-box">
            <div class="result-line">Твой счёт: <span id="finalScore" class="gold">0</span></div>
            <div class="result-line">Рекорд: <span id="finalBest" class="gold">0</span></div>
            <div class="result-line pulse-coins">Заработано: <span id="earnedCoins" class="gold">💰 0</span></div>
        </div>
        <button id="btnRestart" class="btn btn-play">🔄 ЗАНОВО</button>
        <button id="btnDouble" class="btn btn-double">📺 x2 ОЧКИ (реклама)</button>
        <button id="btnMenu" class="btn btn-back">🏠 В МЕНЮ</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
